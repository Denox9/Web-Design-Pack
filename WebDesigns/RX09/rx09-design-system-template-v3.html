.on-accent{color:var(--on-accent)}
.accent-text{color:var(--accent)}
.hazard{height:12px;background:repeating-linear-gradient(45deg,var(--ink) 0 8px,var(--bg) 8px 16px)}
.hazard.orange{background:repeating-linear-gradient(45deg,var(--accent) 0 8px,#0A0A0A 8px 16px)}
.hazard.thin{height:6px;background:repeating-linear-gradient(-45deg,var(--ink) 0 4px,transparent 4px 8px)}
.hazard.tall{height:32px}
.cross{position:absolute;width:24px;height:24px}
.cross::before,.cross::after{content:"";position:absolute;background:var(--ink)}
.cross::before{left:50%;top:0;width:1px;height:100%}
.cross::after{top:50%;left:0;height:1px;width:100%}
.brackets{position:relative}
.brackets::before,.brackets::after{content:"";position:absolute;width:12px;height:12px;border:1px solid var(--ink);pointer-events:none}
.brackets::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.brackets::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.svg-ink{stroke:var(--ink)} .svg-gray{stroke:var(--gray)} .svg-fill-ink{fill:var(--ink)} .svg-track{stroke:var(--line)}
.svg-accent{stroke:var(--accent)} .svg-fill-accent{fill:var(--accent)}

/* =====================================================
   03 // CONTROLS
   ===================================================== */
.btn{
  font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:14px 20px;cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);transition:0s;display:inline-flex;gap:12px;align-items:center;justify-content:space-between;text-decoration:none
}
.btn:hover{background:var(--bg);color:var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}
.btn.accent:hover{background:var(--ink);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn.sm{padding:8px 12px;font-size:10px;box-shadow:2px 2px 0 var(--ink)}
.btn.lg{padding:20px 28px;font-size:14px}
.btn.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);box-shadow:none}
.btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover{background:var(--ink);color:var(--bg)}

.mode-switch{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  display:inline-flex;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;padding:0;white-space:nowrap}
.mode-switch span{padding:7px 10px;transition:0s}
.mode-switch span.on{background:var(--accent);color:var(--on-accent)}
[data-accent="mono"] .mode-switch span.on{background:var(--ink);color:var(--bg)}
.mode-switch:hover span:not(.on){background:var(--ink);color:var(--bg)}

.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{font-family:var(--mono);font-size:14px;padding:12px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:80px}
.field input::placeholder,.field textarea::placeholder{color:var(--gray)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--field-focus)}
.field .hint{font-size:9px;letter-spacing:.16em;color:var(--gray);text-transform:uppercase}
.field.invalid input{border-color:var(--accent);border-left-width:8px}
.field.invalid .hint{color:var(--accent)}
.err{background:var(--ink);color:var(--bg);border-left:8px solid var(--accent);padding:10px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}

.chk{appearance:none;width:18px;height:18px;border:1px solid var(--ink);background:var(--bg);cursor:pointer;display:inline-grid;place-content:center;flex:none}
.chk:checked{background:var(--ink)}
.chk:checked::after{content:"X";color:var(--bg);font:800 11px var(--mono)}
.rad{appearance:none;width:14px;height:14px;border:1px solid var(--ink);transform:rotate(45deg);cursor:pointer;margin:2px;flex:none;background:var(--bg)}
.rad:checked{background:var(--accent);box-shadow:inset 0 0 0 3px var(--bg)}
.opt{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

.toggle{appearance:none;width:48px;height:22px;border:1px solid var(--ink);position:relative;cursor:pointer;background:var(--bg);flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:16px;background:var(--ink)}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{left:26px;background:var(--on-accent)}

.range{appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
.range::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
.range::-moz-range-track{height:2px;background:var(--ink)}
.range::-webkit-slider-thumb{appearance:none;width:12px;height:20px;background:var(--accent);border:1px solid var(--ink);margin-top:-9px}
.range::-moz-range-thumb{width:12px;height:20px;background:var(--accent);border:1px solid var(--ink);border-radius:0}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink)}
.tabs button{font-family:var(--mono);font-size:11px;letter-spacing:.18em;padding:12px 8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:var(--ink);cursor:pointer;text-transform:uppercase;font-weight:700;transition:0s}
.tabs button:hover{background:var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button + button{border-left:1px solid var(--ink)}

.chip{display:inline-block;padding:2px 8px;border:1px solid var(--ink);font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.chip.ok{background:var(--ink);color:var(--bg)}
.chip.warn{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.cut{clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:2px 12px}

.seg{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;height:16px}
.seg i{border:1px solid var(--ink)}
.seg i.on{background:var(--ink)}
.seg i.hot{background:var(--accent);border-color:var(--accent)}

details.acc{border:1px solid var(--ink);border-top:0}
details.acc:first-of-type{border-top:1px solid var(--ink)}
details.acc summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"[+]";color:var(--gray)}
details.acc[open] summary{background:var(--ink);color:var(--bg)}
details.acc[open] summary::after{content:"[−]";color:var(--accent)}
details.acc p{padding:12px 14px;font-size:12px}

[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{
  content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 8px);background:var(--ink);color:var(--bg);
  padding:6px 10px;font:700 9px var(--mono);letter-spacing:.16em;white-space:nowrap;z-index:5;border-left:4px solid var(--accent)
}

/* Toasts + modal */
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-left:8px solid var(--accent);padding:12px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;box-shadow:4px 4px 0 var(--accent);animation:toastIn .2s steps(3)}
@keyframes toastIn{from{transform:translateX(24px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.72);z-index:150;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);color:var(--ink);border:1px solid var(--ink);box-shadow:8px 8px 0 var(--accent);width:min(480px,100%);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}
.modal-head{background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.modal-head button{background:transparent;border:1px solid var(--bg);color:var(--bg);font:700 10px var(--mono);padding:4px 8px;cursor:pointer}
.modal-body{padding:24px;display:grid;gap:16px}

/* =====================================================
   04 // SHOWCASE LAYOUT
   ===================================================== */
.topnav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--ink);display:flex;align-items:stretch;min-height:48px}
.brand-mini{background:var(--ink);color:var(--bg);padding:8px 32px 8px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);font:700 22px var(--hero);letter-spacing:-.03em;display:flex;align-items:center;gap:8px;cursor:pointer;border:0}
.links{display:flex;overflow-x:auto;flex:1;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{display:flex;align-items:center;gap:6px;padding:0 12px;font-size:10px;letter-spacing:.16em;text-decoration:none;white-space:nowrap;border-right:1px solid var(--line);text-transform:uppercase;transition:0s}
.links a span{color:var(--gray)}
.links a:hover{background:var(--ink);color:var(--bg)}
.links a.active{background:var(--accent);color:var(--on-accent);font-weight:800}
.links a.active span,.links a:hover span{color:inherit}
.nav-tools{display:flex;gap:8px;align-items:center;padding:0 12px;border-left:1px solid var(--ink)}

.sec{border-bottom:1px solid var(--ink);padding:64px 32px;position:relative;scroll-margin-top:48px;overflow:hidden}
.sec-head{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:16px;margin-bottom:32px}
.sec-idx{font:400 56px/1 var(--dot);color:var(--accent)}
.sec-title{font:700 clamp(36px,5.5vw,72px)/.82 var(--hero);text-transform:uppercase;letter-spacing:-.035em}
.sec-meta{text-align:right}
.lead{max-width:640px;font-size:13px;margin-bottom:32px}
.lead b{background:var(--ink);color:var(--bg);padding:0 4px}

.cells{display:grid;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.cells > *{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:20px;position:relative}
.cells .tag{position:absolute;top:8px;right:10px}
.c2{grid-template-columns:repeat(2,1fr)} .c3{grid-template-columns:repeat(3,1fr)} .c4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stack{display:grid;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cell-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;margin-bottom:16px;display:flex;gap:8px;align-items:center}
.cell-title::before{content:"";width:8px;height:8px;background:var(--accent)}

/* Cover */
.cover{min-height:calc(100vh - 48px);display:flex;flex-direction:column;justify-content:space-between;padding:32px}
.cover .giant{font-size:clamp(80px,24vw,400px)}
.cover-top{display:flex;justify-content:space-between;gap:24px;position:relative;z-index:1;flex-wrap:wrap}
.cover-mid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin:48px 0}
.readout-diag{transform:translateX(72px) rotate(38deg);transform-origin:left top;min-height:160px;display:flex;flex-direction:column;gap:22px;font:700 13px var(--mono);letter-spacing:.1em}
.readout-diag span::before{content:"";display:inline-block;width:12px;height:12px;background:var(--ink);margin-right:8px;vertical-align:-1px}
.tri-cluster{display:grid;grid-template-columns:repeat(2,14px);gap:4px}

/* Color */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.swatch{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);cursor:pointer;background:transparent;text-align:left;color:var(--ink);font-family:var(--mono);padding:0}
.swatch .chipc{height:120px;border-bottom:1px solid var(--ink);position:relative}
.swatch .info{padding:12px;display:grid;gap:2px}
.swatch:hover .info{background:var(--ink);color:var(--bg)}
.ratio{display:flex;height:40px;border:1px solid var(--ink);margin-top:24px}
.ratio div{display:flex;align-items:center;padding:0 8px;font-size:9px;letter-spacing:.16em;font-weight:800;overflow:hidden;white-space:nowrap}

/* Type */
.spec{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--ink)}
.spec > div{padding:20px 0;border-bottom:1px solid var(--line)}
.spec .meta{padding-right:16px}
.scale-row{display:grid;grid-template-columns:80px 80px 1fr;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.tester{border:1px solid var(--ink);padding:24px;display:grid;gap:16px}
.tester-tabs{flex:1 1 280px;max-width:420px}
.tester-out{min-height:140px;display:flex;align-items:center;overflow:hidden;word-break:break-all;border-top:1px solid var(--line);padding-top:16px}

/* Grid */
.unit-bars{display:grid;gap:10px}
.unit-bars div{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:12px}
.unit-bars i{display:block;height:16px;background:var(--ink)}
.col12{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;height:140px}
.col12 div{background:var(--line);display:flex;align-items:flex-end;justify-content:center;padding:6px;font:700 10px var(--mono)}
.col12 div.sp{background:var(--accent);color:var(--on-accent);grid-column:span 4}
.col12 div.sp8{background:var(--ink);color:var(--bg);grid-column:span 8}

/* Shapes */
.shape-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px}
.shape{height:120px;background:var(--ink);display:flex;align-items:flex-end;padding:10px;color:var(--bg);font:700 10px var(--mono);letter-spacing:.14em}
.shape.o{background:var(--accent);color:var(--on-accent)}
.shape.outline{background:transparent;border:1px solid var(--ink);color:var(--ink)}

/* Glyphs */
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.glyph{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:16px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;background:transparent;color:var(--ink);cursor:pointer;font-family:var(--mono)}
.glyph:hover{background:var(--ink);color:var(--bg)}
.glyph:hover .micro{color:var(--accent)}

/* Warning plates */
.plate{border:2px solid var(--ink);display:grid;grid-template-columns:auto 1fr}
.plate .sym{background:var(--ink);color:var(--bg);padding:16px;display:grid;place-items:center}
.plate .txt{padding:12px 16px}
.plate .word{font:700 32px/.9 var(--hero);letter-spacing:-.02em}
.plate.danger .sym{background:var(--accent);color:var(--on-accent)}
.plate.danger{border-color:var(--accent)}
.plate.inverse{background:var(--ink);color:var(--bg)}
.plate.inverse .sym{background:var(--bg);color:var(--ink)}

/* Data */
.readout{font-family:var(--display);font-size:44px;line-height:1}
.readout.accent{color:var(--on-accent);background:var(--accent);padding:4px 8px;align-self:flex-start;display:inline-block}
.lcd{font:400 48px/1 var(--dot);letter-spacing:.04em}
.meters{display:flex;gap:14px;align-items:flex-end;height:120px}
.meter{width:14px;height:100%;border:1px solid var(--ink);position:relative}
.meter i{position:absolute;left:2px;right:2px;bottom:2px;background:var(--ink);transition:height .6s steps(6)}
.meter.hot i{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-weight:700;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--ink);font-size:10px}
tbody tr:hover{background:var(--ink);color:var(--bg)}
.terminal{background:#0A0A0A;color:#ECECEC;padding:16px;font-size:12px;min-height:220px;border-left:8px solid var(--accent)}
.terminal .p{color:var(--accent)}
[data-accent="mono"] .terminal .p{color:#ECECEC}

/* Motion */
.scan-box{height:180px;border:1px solid var(--ink);position:relative;overflow:hidden;display:grid;place-items:center}
.scan-box::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);top:0;animation:scan 2.4s linear infinite}
@keyframes scan{to{top:100%}}
.ticker{overflow:hidden;white-space:nowrap;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.ticker span{display:inline-block;padding:8px 0;animation:tick 30s linear infinite;font-size:10px;letter-spacing:.25em}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.step-anim{width:24px;height:24px;background:var(--accent);animation:stepmove 2s steps(8) infinite alternate}
@keyframes stepmove{to{transform:translateX(200px) rotate(180deg)}}

/* Samples */
.sample-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px}
.sample{display:grid;gap:12px;align-content:start}
.sample-cap{display:flex;justify-content:space-between;border-top:1px solid var(--ink);padding-top:8px}

.poster{aspect-ratio:1;container-type:inline-size;position:relative;overflow:hidden;border:1px solid var(--ink);background:var(--bg)}
.poster > *{position:absolute}
.poster .p-logo{top:0;left:0;width:32cqw;height:8cqw;background:var(--ink);color:var(--bg);clip-path:polygon(0 0,100% 0,82% 100%,0 100%);display:flex;align-items:center;padding-left:2.5cqw;font:700 5cqw var(--hero);letter-spacing:-.05em}
.poster .p-credit{top:2cqw;right:2cqw;display:flex;gap:1cqw;font:700 1.1cqw/1.3 var(--mono);letter-spacing:.08em}
.poster .p-jp{top:13.5cqw;left:29cqw;font-size:1.6cqw;display:flex;gap:1cqw;align-items:center}
.poster .p-warn{top:19cqw;left:2cqw;width:5cqw}
.poster .p-id{top:25cqw;left:2cqw;font:800 1.5cqw/1.25 var(--mono);text-transform:uppercase}
.poster .p-id b{font-size:3.4cqw;display:block;line-height:1.1}
.poster .p-read{top:35cqw;left:64cqw;transform:rotate(38deg);transform-origin:left top;display:flex;flex-direction:column;gap:3cqw;font:700 1.1cqw var(--mono)}
.poster .p-read span::before{content:"";display:inline-block;width:1.3cqw;height:1.3cqw;background:var(--ink);margin-right:.8cqw}
.poster .p-font{top:61cqw;left:57cqw;font:800 1.6cqw/1.3 var(--mono)}
.poster .p-bb{top:66cqw;left:58cqw;width:30cqw;height:12cqw}
.poster .p-bb .ghost{position:absolute;inset:0;font:700 10cqw/1 var(--hero);color:transparent;-webkit-text-stroke:1px var(--accent);letter-spacing:-.04em}
.poster .p-bb .solid{position:absolute;left:3cqw;top:3cqw;font:700 4.6cqw/1 var(--hero);color:var(--accent);letter-spacing:-.02em}
.poster .p-meters{top:63cqw;left:27cqw;display:flex;gap:2cqw;height:12cqw}
.poster .p-meters i{width:.9cqw;height:100%;border:1px solid var(--ink);position:relative;display:block}
.poster .p-meters i::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;background:var(--ink);height:var(--h)}
.poster .p-giant{left:2cqw;bottom:-2.5cqw;font:700 30cqw/.8 var(--hero);letter-spacing:-.06em}
.poster .p-tag{right:2cqw;bottom:2cqw;font:700 1.2cqw var(--mono)}
.poster .p-sa{top:60cqw;left:13cqw;transform:rotate(45deg);font:700 1.2cqw var(--mono)}

.label-card{border:2px solid var(--ink);background:var(--bg)}
.label-head{background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;padding:8px 12px}
.label-body{display:grid;grid-template-columns:1.3fr 1fr}
.label-body > div{padding:16px}
.label-body > div + div{border-left:1px solid var(--ink)}
.spec-table{width:100%;font-size:10px}
.spec-table td{padding:5px 0;border-bottom:1px dashed var(--line)}
.spec-table td:last-child{text-align:right;font-weight:800}
.label-foot{border-top:1px solid var(--ink);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:12px}

.picto-sheet{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);background:var(--bg)}
.picto{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;text-align:center}
.picto:nth-child(4n){border-right:0}
.picto .ix{position:absolute;top:4px;left:6px;font-size:8px;letter-spacing:.14em}
.picto .en{font:800 9px var(--mono);letter-spacing:.14em}
.picto .jp{font-size:10px}

.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tier{border:1px solid var(--ink);padding:20px;display:grid;gap:14px;align-content:start;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.tier.feat{background:var(--ink);color:var(--bg)}

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* =====================================================
   STORE + THEME
   ===================================================== */
const store = {
  users(){ return JSON.parse(localStorage.getItem("rx09_users") || "[]"); },
  save(u){ localStorage.setItem("rx09_users", JSON.stringify(u)); },
  session(){ return JSON.parse(localStorage.getItem("rx09_session") || "null"); },
  setSession(s){ s ? localStorage.setItem("rx09_session", JSON.stringify(s)) : localStorage.removeItem("rx09_session"); }
};

function useDocAttr(attr, key, fallback) {
  const [v, setV] = useState(document.documentElement.getAttribute(attr) || fallback);
  useEffect(() => { document.documentElement.setAttribute(attr, v); localStorage.setItem(key, v); }, [v]);
  return [v, setV];
}

function ThemeSwitch({ theme, setTheme }) {
  const dark = theme === "dark";
  return (
    <button className="mode-switch" role="switch" aria-checked={dark} aria-label="Toggle dark mode"
            onClick={() => setTheme(dark ? "light" : "dark")}>
      <span className={!dark ? "on" : ""}>DAY</span><span className={dark ? "on" : ""}>夜 NIGHT</span>
    </button>
  );
}
function AccentSwitch({ accent, setAccent }) {
  const mono = accent === "mono";
  return (
    <button className="mode-switch" role="switch" aria-checked={mono} aria-label="Toggle pictogram mode (no accent)"
            onClick={() => setAccent(mono ? "signal" : "mono")}>
      <span className={!mono ? "on" : ""}>A·SIGNAL</span><span className={mono ? "on" : ""}>B·PICTO</span>
    </button>
  );
}

/* =====================================================
   GLYPH KIT (24px grid, 2px stroke, square caps)
   ===================================================== */
const G = {
  CROSSHAIR: <><path d="M12 2v20M2 12h20"/><rect x="8" y="8" width="8" height="8"/></>,
  BRACKET:   <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/>,
  CHECK_X:   <><rect x="3" y="3" width="18" height="18"/><path d="M7 7l10 10M17 7L7 17"/></>,
  TRIANGLES: <path d="M3 4h7L3 11zM14 4h7l-7 7zM3 13h7l-7 7zM14 13h7l-7 7z"/>,
  CHEVRONS:  <path d="M3 6l6 6-6 6M10 6l6 6-6 6M17 6l4 6-4 6"/>,
  WARNING:   <><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 17.5v1"/></>,
  GLOBE:     <><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></>,
  BARCODE:   <path d="M3 4v16M6 4v16M7.5 4v16M11 4v16M14 4v16M15.5 4v16M19 4v16M21 4v16"/>,
  ARROW:     <path d="M19 5L5 19M5 9v10h10"/>,
  POWER:     <><path d="M12 2v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></>,
  BATTERY:   <><path d="M2 7h17v10H2zM19 10h3v4h-3"/><path d="M5 10v4M8 10v4M11 10v4"/></>,
  MODULE:    <><rect x="7" y="7" width="10" height="10"/><path d="M10 2v5M14 2v5M10 17v5M14 17v5M2 10h5M2 14h5M17 10h5M17 14h5"/></>,
  ROUTE:     <><path d="M3 18h6l6-12h6"/><rect x="1" y="16" width="4" height="4"/><circle cx="21" cy="6" r="2"/></>,
  SIGNAL:    <path d="M4 20v-4M9 20v-8M14 20v-12M19 20V4"/>,
  LOCK:      <><path d="M5 11h14v10H5z"/><path d="M8 11V5l2-2h4l2 2v6"/><path d="M12 15v2"/></>,
  BOLT:      <path d="M13 2L4 14h7l-2 8 11-13h-7z"/>,
  HEX:       <><path d="M12 2l8.7 5v10L12 22l-8.7-5V7z"/><circle cx="12" cy="12" r="3"/></>,
  MOVE:      <path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/>,
  NO_ENTRY:  <><path d="M7 2h10l5 5v10l-5 5H7l-5-5V7z"/><path d="M6 12h12"/></>,
  DATA:      <><path d="M4 4h16v5H4zM4 9.5h16v5H4zM4 15h16v5H4z"/><path d="M7 6.5h2M7 12h2M7 17.5h2"/></>,
};
function Glyph({ name, size = 24, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"}
         strokeWidth="2" strokeLinecap="square" strokeLinejoin="miter" aria-hidden="true">{G[name]}</svg>
  );
}

/* BAYBAYIN // vector glyphs from the RX09 SVG engine (fill = currentColor, follows theme + state) */
function BB({ text, height = 32, killer = "krus", color, className = "" }) {
  const svg = React.useMemo(() => (window.RX09Baybayin ? window.RX09Baybayin.toSVG(text || " ", { height, killer, color }) : ""), [text, height, killer, color]);
  return <span className={"bb-svg " + className} dangerouslySetInnerHTML={{ __html: svg }} />;
}
function CircuitTrace({ style, dense }) {
  // preserveAspectRatio="none" stretches the 600x600 grid to any box.
  // Strokes with non-scaling-stroke keep their pixel size, so nodes and bars are drawn
  // as strokes (zero-length round caps = true circles) instead of filled shapes.
  const ns = { vectorEffect: "non-scaling-stroke" };
  return (
    <svg aria-hidden="true" viewBox="0 0 600 600" preserveAspectRatio="none"
         style={{ position:"absolute", inset:0, width:"100%", height:"100%", maxWidth:"none", pointerEvents:"none", ...style }}>
      <g fill="none" strokeWidth="1" className="svg-ink">
        <path d="M0 60 H160 L260 160 H380 L560 340" {...ns} />
        <path d="M60 230 H110 L190 310 L320 440 V600" {...ns} />
        <path d="M300 0 L420 120 H520 L600 200" {...ns} />
        {dense && <path d="M600 420 H520 L460 480 V600" {...ns} />}
      </g>
      <g fill="none" strokeWidth="1" className="svg-gray">
        <path d="M0 380 H70 L150 460 V600" {...ns} />
        <path d="M400 0 L470 70 H600" {...ns} />
        {dense && <path d="M0 520 H200 L260 460 H360" {...ns} />}
      </g>
      <g fill="none" strokeWidth="7" strokeLinecap="butt" className="svg-ink">
        <path d="M190 90 L230 130" {...ns} />
        <path d="M235 355 L275 395" {...ns} />
      </g>
      <g fill="none" strokeWidth="9" strokeLinecap="round" className="svg-ink">
        <path d="M560 340 h0" {...ns} />
        <path d="M60 230 h0" {...ns} />
        <path d="M594 194 h0" {...ns} />
        {dense && <path d="M360 460 h0" {...ns} />}
      </g>
    </svg>
  );
}
function WarnTriangle({ size = 44 }) {
  return (
    <svg width={size} height={typeof size === "number" ? size * 0.88 : undefined} viewBox="0 0 50 44" aria-hidden="true" style={{ display:"block", height:"auto" }}>
      <polygon points="25,2 48,42 2,42" style={{ fill:"var(--accent)" }} />
      <rect x="23" y="14" width="4" height="15" style={{ fill:"var(--on-accent)" }} />
      <rect x="23" y="33" width="4" height="4" style={{ fill:"var(--on-accent)" }} />
    </svg>
  );
}

function Triangles() {
  return (
    <div className="tri-cluster" aria-hidden="true">
      {[0,1,2,3].map(i => (
        <svg key={i} width="14" height="14" viewBox="0 0 14 14"><path d="M1 1h12L1 13z" fill="none" className="svg-ink" /></svg>
      ))}
    </div>
  );
}

/* Seeded random for stable barcodes / QR */
function seeded(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function Barcode({ width = 160, height = 40, seed = 7 }) {
  const r = seeded(seed); const bars = []; let x = 0;
  while (x < width) { const w = 1 + Math.floor(r() * 3); if (r() > .4) bars.push(<rect key={x} x={x} y="0" width={w} height={height} />); x += w + 1; }
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="svg-fill-ink" aria-hidden="true">{bars}</svg>;
}

function MatrixCode({ size = 84, seed = 3 }) {
  const n = 21, c = size / n, r = seeded(seed), cells = [];
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on;
    if (finder(x, y)) { const fx = x % (n - 7) , fy = y % (n - 7); const lx = x >= n - 7 ? x - (n - 7) : x, ly = y >= n - 7 ? y - (n - 7) : y;
      on = lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4); }
    else on = r() > .52;
    if (on) cells.push(<rect key={x + "-" + y} x={x * c} y={y * c} width={c} height={c} />);
  }
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="svg-fill-ink" aria-hidden="true">{cells}</svg>;
}

function Gauge({ value, label = "CORE LOAD %" }) {
  const r = 52, c = 2 * Math.PI * r, arc = c * (240 / 360), filled = arc * (value / 100), hot = value > 80;
  return (
    <svg viewBox="0 0 140 120" width="100%" style={{ maxWidth:180 }} role="img" aria-label={`${label} ${value}`}>
      <g transform="rotate(150 70 70)" fill="none" strokeWidth="10">
        <circle cx="70" cy="70" r={r} className="svg-track" strokeDasharray={`${arc} ${c}`} />
        <circle cx="70" cy="70" r={r} style={{ stroke: hot ? "var(--accent)" : "var(--ink)", transition:"stroke-dasharray .6s steps(8)" }} strokeDasharray={`${filled} ${c}`} />
      </g>
      {Array.from({ length: 13 }).map((_, i) => { const a = (150 + i * 20) * Math.PI / 180;
        return <line key={i} className="svg-ink" x1={70 + 62 * Math.cos(a)} y1={70 + 62 * Math.sin(a)} x2={70 + 67 * Math.cos(a)} y2={70 + 67 * Math.sin(a)} />; })}
      <text x="70" y="78" textAnchor="middle" className="svg-fill-ink" fontFamily="Chakra Petch" fontWeight="700" fontSize="28">{String(value).padStart(2,"0")}</text>
      <text x="70" y="96" textAnchor="middle" className="svg-fill-ink" fontFamily="JetBrains Mono" fontSize="7" letterSpacing="2">{label}</text>
    </svg>
  );
}

function Sparkline({ data, w = 300, h = 80 }) {
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((d, i) => `${(i / (data.length - 1)) * w},${h - 6 - ((d - min) / (max - min || 1)) * (h - 12)}`);
  const last = pts[pts.length - 1].split(",");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} preserveAspectRatio="none" aria-hidden="true">
      {[0.25,0.5,0.75].map(y => <line key={y} x1="0" x2={w} y1={h*y} y2={h*y} className="svg-track" strokeDasharray="2 4" />)}
      <polyline points={pts.join(" ")} fill="none" className="svg-ink" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
      <rect x={last[0] - 4} y={last[1] - 4} width="8" height="8" className="svg-fill-accent" />
    </svg>
  );
}

function Count({ to, pad = 3, className }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (reduced()) { setN(to); return; }
    let f = 0; const id = setInterval(() => { f++; setN(Math.round(to * f / 20)); if (f >= 20) clearInterval(id); }, 40);
    return () => clearInterval(id);
  }, [to]);
  return <span className={className}>{String(n).padStart(pad, "0")}</span>;
}

function Clock() {
  const [t, setT] = useState(new Date());
  useEffect(() => { const id = setInterval(() => setT(new Date()), 1000); return () => clearInterval(id); }, []);
  return <span>{t.toLocaleTimeString("en-GB")}</span>;
}

function useTelemetry(ms = 2500) {
  const [load, setLoad] = useState(64);
  const [bars, setBars] = useState([70, 45, 88, 30, 60, 92]);
  const [spark, setSpark] = useState(() => Array.from({ length: 24 }, (_, i) => 40 + Math.sin(i / 2) * 20 + i));
  useEffect(() => {
    const id = setInterval(() => {
      setLoad(Math.floor(40 + Math.random() * 55));
      setBars(b => b.map(() => Math.floor(15 + Math.random() * 85)));
      setSpark(s => [...s.slice(1), Math.max(5, s[s.length - 1] + (Math.random() - .5) * 30)]);
    }, ms);
    return () => clearInterval(id);
  }, []);
  return { load, bars, spark };
}

function Modal({ onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    ref.current && ref.current.focus();
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" role="dialog" aria-modal="true" aria-labelledby="mt" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><span id="mt" className="label b">▲ CONFIRM // 確認</span><button ref={ref} onClick={onClose} aria-label="Close">[X] ESC</button></div>
        <div className="modal-body">
          <p className="giant" style={{ fontSize:56 }}>PURGE?</p>
          <p>This will reset unit <b>RX-09</b> to factory calibration. Logs are kept.</p>
          <div className="hazard orange" />
          <div className="row"><button className="btn accent" onClick={onClose}><span>CONFIRM</span><span>&gt;&gt;</span></button><button className="btn ghost" onClick={onClose}>CANCEL</button></div>
        </div>
      </div>
    </div>
  );
}

function Showcase({ setView, theme, setTheme, accent, setAccent }) {
  const [active, setActive] = useState("cover");
  const [toasts, setToasts] = useState([]);
  const [modal, setModal] = useState(false);

  const notify = useCallback((msg) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t.slice(-2), { id, msg }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }, []);

  const go = (id) => { const el = document.getElementById(id); el && el.scrollIntoView({ behavior: reduced() ? "auto" : "smooth" }); };

  useEffect(() => {
    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActive(e.target.id)), { rootMargin:"-40% 0px -55% 0px" });
    SECTIONS.forEach(([id]) => { const el = document.getElementById(id); el && io.observe(el); });
    return () => io.disconnect();
  }, []);

  return (
    <>
      <nav className="topnav" aria-label="Design system sections">
        <button className="brand-mini" onClick={() => go("cover")} aria-label="Back to top">RX<span className="micro" style={{ color:"var(--gray)" }}>SYS</span></button>
        <div className="links">
          {SECTIONS.map(([id, n, t]) => (
            <a key={id} href={"#" + id} className={active === id ? "active" : ""} aria-current={active === id ? "true" : undefined}
               onClick={e => { e.preventDefault(); go(id); }}><span>{n}</span>{t}</a>
          ))}
        </div>
        <div className="nav-tools">
          <ThemeSwitch theme={theme} setTheme={setTheme} />
          <AccentSwitch accent={accent} setAccent={setAccent} />
        </div>
      </nav>
      <main>
        <Cover go={go} />
        <ColorSec notify={notify} />
        <TypeSec />
        <BaybayinSec notify={notify} />
        <GridSec />
        <ShapeSec />
        <GlyphSec notify={notify} />
        <WarningSec />
        <ComponentSec notify={notify} openModal={() => setModal(true)} />
        <DataSec />
        <MotionSec />
        <SamplesSec setView={setView} />
        <TokensSec notify={notify} />
      </main>
      <footer className="footer">
        <p className="micro bb-inline">2026 BLACKBOX. BUILT TO WIN, BORN TO RIDE. · A BLACKBOX GRAFX ORIGINAL SYSTEM · <BB text="bayan" height={12} /> SCRIPT CONNECTS PEOPLE</p>
        <p className="micro">BRAND: RX / MODEL: 09 / MODE: {accent === "mono" ? "B·PICTOGRAM" : "A·SIGNAL"} / {theme === "dark" ? "NIGHT OPS" : "DAY"}</p>
      </footer>
      <div className="toasts" aria-live="polite">{toasts.map(t => <div key={t.id} className="toast">{t.msg}</div>)}</div>
      {modal && <Modal onClose={() => setModal(false)} />}
    </>
  );
}

/* =====================================================

function Auth({ onAuth, onBack, theme, setTheme }) {
  const [mode, setMode] = useState("login");
  const [form, setForm] = useState({ name:"", email:"", password:"", confirm:"" });
  const [error, setError] = useState("");
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  function submit(e) {
    e.preventDefault(); setError("");
    const users = store.users();
    const email = form.email.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) return setError("ERR_01 // INVALID EMAIL FORMAT");
    if (form.password.length < 6) return setError("ERR_02 // PASSWORD MIN 6 CHARS");
    if (mode === "signup") {
      if (!form.name.trim()) return setError("ERR_03 // OPERATOR NAME REQUIRED");
      if (form.password !== form.confirm) return setError("ERR_04 // PASSWORDS DO NOT MATCH");
      if (users.some(u => u.email === email)) return setError("ERR_05 // OPERATOR ALREADY REGISTERED");
      const user = { id:"OP-" + String(users.length + 1).padStart(3, "0"), name:form.name.trim(), email, password:form.password };
      store.save([...users, user]); store.setSession({ id:user.id, name:user.name, email });
      return onAuth(store.session());
    }
    const u = users.find(x => x.email === email && x.password === form.password);
    if (!u) return setError("ERR_06 // ACCESS DENIED — CHECK CREDENTIALS");
    store.setSession({ id:u.id, name:u.name, email }); onAuth(store.session());
  }

  return (
    <main className="auth">
      <section className="auth-art" aria-hidden="true">
        <CircuitTrace />
        <div style={{ position:"relative" }}>
          <div className="logo-plate" style={{ font:"700 28px var(--hero)" }}>RX</div>
          <p className="micro bb-inline" style={{ marginTop:16 }}>//:001 &nbsp; SA/CT_II &nbsp; 想像力を動力源 &nbsp; <BB text="bantay" height={16} /></p>
        </div>
        <div className="cross" style={{ top:"38%", right:"18%" }} /><div className="cross" style={{ top:"62%", right:"10%" }} />
        <div style={{ position:"relative" }}>
          <p className="label" style={{ marginBottom:12 }}>■ 00.15 &nbsp; ■ 00.05 &nbsp; ■ 00.19.90<span className="blink">_</span></p>
          <h1 className="giant">RX-09</h1>
          <div className="hazard" style={{ marginTop:16, width:"60%" }} />
        </div>
      </section>
      <section className="auth-panel">
        <div className="auth-tools">
          <button className="btn ghost sm" onClick={onBack}>&lt;&lt; SYSTEM</button>
          <ThemeSwitch theme={theme} setTheme={setTheme} />
        </div>
        <div className="warn">
          <WarnTriangle />
          <div><p className="label b">SECURITY PROTOCOL ACTIVE</p><p className="micro">警告 — AUTHORIZED OPERATORS ONLY</p></div>
        </div>
        <div className="tabs" role="tablist" aria-label="Authentication mode">
          {[["login","01 [LOGIN]"],["signup","02 [SIGN UP]"]].map(([k, t]) => (
            <button key={k} role="tab" aria-selected={mode === k} onClick={() => { setMode(k); setError(""); }}>{t}</button>
          ))}
        </div>
        <form onSubmit={submit} noValidate>
          {mode === "signup" && <div className="field"><label className="label" htmlFor="name">Operator Name</label><input id="name" value={form.name} onChange={set("name")} autoComplete="name" placeholder="KIERWIN RAMOS" /></div>}
          <div className="field"><label className="label" htmlFor="email">Email // ID</label><input id="email" type="email" value={form.email} onChange={set("email")} autoComplete="email" placeholder="operator@rx09.sys" /></div>
          <div className="field"><label className="label" htmlFor="pw">Access Key</label><input id="pw" type="password" value={form.password} onChange={set("password")} autoComplete={mode === "login" ? "current-password" : "new-password"} placeholder="••••••" /></div>
          {mode === "signup" && <div className="field"><label className="label" htmlFor="pw2">Confirm Access Key</label><input id="pw2" type="password" value={form.confirm} onChange={set("confirm")} autoComplete="new-password" placeholder="••••••" /></div>}
          {error && <p className="err" role="alert">▲ {error}</p>}
          <button className={"btn " + (mode === "login" ? "" : "accent")} type="submit"><span>{mode === "login" ? "INITIATE ACCESS" : "REGISTER OPERATOR"}</span><span>&gt;&gt;&gt;</span></button>
        </form>
        <p className="micro">DEMO ONLY: ACCOUNTS ARE STORED IN THIS BROWSER</p>
      </section>
    </main>
  );
}

          </section>

              <tbody>{LOGS.map(l => <tr key={l.id}><td>{l.id}</td><td><b>{l.unit}</b></td><td>{l.event}</td><td>{l.t}</td><td><span className={"chip " + (l.s === "OK" ? "ok" : "warn")}>{l.s}</span></td></tr>)}</tbody>

          </section>

/* =====================================================
   APP
   ===================================================== */
function App() {
  const [theme, setTheme] = useDocAttr("data-theme", "rx09_theme", "light");
  const [accent, setAccent] = useDocAttr("data-accent", "rx09_accent", "signal");
  const [view, setView] = useState("showcase");
  const [user, setUser] = useState(store.session());

  useEffect(() => { window.scrollTo(0, 0); }, [view]);

  if (view === "auth")
    return <Auth theme={theme} setTheme={setTheme} onBack={() => setView("showcase")} onAuth={(u) => { setUser(u); setView("dashboard"); }} />;
  if (view === "dashboard" && user)
    return <Dashboard user={user} theme={theme} setTheme={setTheme} onBack={() => setView("showcase")}
                      onLogout={() => { store.setSession(null); setUser(null); setView("auth"); }} />;
  return <Showcase setView={setView} theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
