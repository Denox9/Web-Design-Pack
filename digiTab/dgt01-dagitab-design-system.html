/* =========================================================
   DGT-01 // DAGITAB DESIGN SYSTEM v1.0
   Minimal dark-first web kit · six-colour spectrum · Baybayin layer
   01 TOKENS
   ========================================================= */
:root{
  --c-dahon:#3ECF8E; --c-langit:#3B9EFF; --c-ube:#9B7BFF;
  --c-mangga:#F5B83D; --c-gumamela:#F2555A; --c-dagat:#2EC4D6;
  --accent:var(--c-dahon); --on-accent:#0B0B0B;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"RX09 Baybayin",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,"RX09 Baybayin",monospace;
  --bb:"RX09 Baybayin","Noto Sans Tagalog",sans-serif;
  --r-sm:4px; --r:6px; --r-lg:10px; --r-xl:14px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --hdr:56px; --side:248px; --toc:208px; --max:880px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --bg:#121212; --bg-alt:#171717; --surface:#1C1C1C; --surface-2:#242424;
  --border:#2E2E2E; --border-strong:#3E3E3E;
  --text:#EDEDED; --text-muted:#A1A1A1; --text-faint:#6E6E6E;
  --accent-text:var(--accent); --shadow:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#FCFCFC; --bg-alt:#F6F6F6; --surface:#FFFFFF; --surface-2:#F1F1F1;
  --border:#E6E6E6; --border-strong:#D2D2D2;
  --text:#171717; --text-muted:#5E5E5E; --text-faint:#8C8C8C;
  --accent-text:color-mix(in srgb,var(--accent) 62%,#000); --shadow:0 8px 24px rgba(0,0,0,.08);
  color-scheme:light;
}
[data-accent="dahon"]{--accent:var(--c-dahon)}
[data-accent="langit"]{--accent:var(--c-langit)}
[data-accent="ube"]{--accent:var(--c-ube)}
[data-accent="mangga"]{--accent:var(--c-mangga)}
[data-accent="gumamela"]{--accent:var(--c-gumamela)}
[data-accent="dagat"]{--accent:var(--c-dagat)}
/* tone helper: any element can carry its own spectrum colour via --t */
.t-dahon{--t:var(--c-dahon)} .t-langit{--t:var(--c-langit)} .t-ube{--t:var(--c-ube)}
.t-mangga{--t:var(--c-mangga)} .t-gumamela{--t:var(--c-gumamela)} .t-dagat{--t:var(--c-dagat)}
.t-accent{--t:var(--accent)}

/* 02 BASE */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(var(--hdr) + 16px)}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{display:block;max-width:100%}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
code,kbd,pre{font-family:var(--mono)}
.mono{font-family:var(--mono)}
.muted{color:var(--text-muted)} .faint{color:var(--text-faint)}
.accent-text{color:var(--accent-text)}
.rx-bb{font-family:var(--bb);font-weight:700;letter-spacing:0;text-transform:none;line-height:1.35}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);display:inline-flex;gap:8px;align-items:center}
.eyebrow .rx-bb{font-size:14px;color:var(--t,var(--accent-text))}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:20px;height:20px}

/* 03 SHELL // header + sidebar + content + toc */
.hdr{position:sticky;top:0;z-index:50;height:var(--hdr);display:flex;align-items:center;gap:var(--s4);padding:0 var(--s5);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;flex:none}
.logo svg{width:26px;height:26px}
.logo .ver{font:500 11px var(--mono);color:var(--text-faint);border:1px solid var(--border);border-radius:var(--r-pill);padding:1px 8px}
.hdr-nav{display:flex;gap:2px;margin-left:var(--s3)}
.hdr-nav a{padding:6px 10px;border-radius:var(--r);color:var(--text-muted);font-size:13px}
.hdr-nav a:hover,.hdr-nav a.on{color:var(--text);background:var(--surface-2)}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.search{display:flex;align-items:center;gap:8px;height:32px;min-width:220px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-alt);color:var(--text-faint);cursor:pointer;font-size:13px}
.search:hover{border-color:var(--border-strong);color:var(--text-muted)}
.search kbd{margin-left:auto}
kbd{font:500 11px var(--mono);padding:1px 6px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:var(--r-sm);background:var(--surface);color:var(--text-muted)}
.dots{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:var(--r-pill)}
.dot{width:18px;height:18px;border-radius:50%;border:0;background:var(--t);cursor:pointer;position:relative}
.dot[aria-pressed="true"]::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--text)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--border);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--text-muted)}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2)}
.theme-ic-sun{display:none}
[data-theme="light"] .theme-ic-sun{display:block}[data-theme="light"] .theme-ic-moon{display:none}
.menu-btn{display:none}

.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--toc);max-width:1440px;margin:0 auto}
.side{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;padding:var(--s5) var(--s3) var(--s7);border-right:1px solid var(--border);scrollbar-width:thin}
.side h6{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:0 10px;margin:var(--s5) 0 var(--s2);display:flex;justify-content:space-between}
.side h6:first-child{margin-top:0}
.side h6 .rx-bb{font-size:12px;letter-spacing:0}
.side a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--r);color:var(--text-muted);font-size:13.5px}
.side a .pip{width:6px;height:6px;border-radius:2px;background:var(--t);opacity:.85;flex:none}
.side a:hover{color:var(--text);background:var(--surface)}
.side a[aria-current="page"]{color:var(--text);background:var(--surface-2);font-weight:500}
.side-foot{margin-top:var(--s6);padding:var(--s4) 10px 0;border-top:1px solid var(--border)}

.page{min-width:0;padding:var(--s7) var(--s7) var(--s9)}
.page-in{max-width:var(--max);margin:0 auto}
.page.wide .page-in{max-width:1080px}
.toc{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));padding:var(--s7) var(--s4) 0 var(--s2);font-size:12.5px}
.toc p{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:var(--s3)}
.toc a{display:block;padding:4px 0 4px 12px;border-left:1px solid var(--border);color:var(--text-muted)}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--accent-text);border-left-color:var(--accent)}
.page-head{margin-bottom:var(--s7)}
.page-head h1{font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.025em;font-weight:600;margin:var(--s3) 0 var(--s3)}
.page-head p{font-size:16px;color:var(--text-muted);max-width:640px}
.page h2{font-size:20px;letter-spacing:-.015em;font-weight:600;margin:var(--s8) 0 var(--s2);display:flex;align-items:center;gap:10px}
.page h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--t,var(--accent));flex:none}
.page h2 + .lead{margin-bottom:var(--s5)}
.page h3{font-size:15px;font-weight:600;margin-bottom:var(--s2)}
.lead{color:var(--text-muted);max-width:680px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s9)}
.pager a{border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4) var(--s5);display:grid;gap:2px}
.pager a:hover{border-color:var(--border-strong);background:var(--surface)}
.pager a span{font-size:12px;color:var(--text-faint)} .pager a b{font-weight:500}
.pager a.next{text-align:right;grid-column:2}
.site-foot{border-top:1px solid var(--border);padding:var(--s5);display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--s3);color:var(--text-faint);font-size:12px}

/* 04 PRIMITIVES */
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:var(--s3)}
.grid{display:grid;gap:var(--s4)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);position:relative;min-width:0;transition:border-color .15s var(--ease)}
a.card:hover,.card.hover:hover{border-color:var(--border-strong)}
.card.tone{border-color:color-mix(in srgb,var(--t) 30%,var(--border))}
.card .art{color:var(--text);margin:calc(var(--s5) * -1) calc(var(--s5) * -1) var(--s4);border-bottom:1px solid var(--border);border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden;background:var(--bg-alt)}
.card .art svg{width:100%;height:auto}
.card-ic{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:var(--t);background:color-mix(in srgb,var(--t) 12%,transparent);border:1px solid color-mix(in srgb,var(--t) 30%,transparent);margin-bottom:var(--s4)}
.card h3{display:flex;gap:8px;align-items:center}
.card p{color:var(--text-muted);font-size:13.5px}
.panel{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px var(--s4);border-bottom:1px solid var(--border);background:var(--bg-alt);font-size:12.5px;color:var(--text-muted)}
.panel-body{padding:var(--s5)}
.demo{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-alt);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:16px 16px;padding:var(--s6) var(--s5);display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.hr{height:1px;background:var(--border);border:0;margin:var(--s6) 0}

/* 05 COMPONENTS */
.btn{--t:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.btn:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--text) 8%);border-color:color-mix(in srgb,var(--border-strong) 70%,var(--text) 20%)}
.btn-primary{background:color-mix(in srgb,var(--t) 88%,#000);border-color:var(--t);color:var(--on-accent)}
.btn-primary:hover{background:var(--t);border-color:var(--t)}
.btn-soft{background:color-mix(in srgb,var(--t) 14%,transparent);border-color:color-mix(in srgb,var(--t) 40%,transparent);color:var(--t)}
[data-theme="light"] .btn-soft{color:color-mix(in srgb,var(--t) 62%,#000)}
.btn-soft:hover{background:color-mix(in srgb,var(--t) 22%,transparent);border-color:var(--t)}
.btn-outline{background:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;color:var(--text)}
.btn-danger{--t:var(--c-gumamela)}
.btn-link{background:none;border:0;padding:0;height:auto;color:var(--accent-text)}
.btn-link:hover{background:none;text-decoration:underline;text-underline-offset:3px}
.btn-sm{height:26px;padding:0 10px;font-size:12px}
.btn-lg{height:40px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .ic{width:14px;height:14px}
.badge{--t:var(--text-muted);display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-pill);font:500 11.5px var(--sans);color:var(--t);background:color-mix(in srgb,var(--t) 12%,transparent);border:1px solid color-mix(in srgb,var(--t) 30%,transparent);white-space:nowrap}
[data-theme="light"] .badge{color:color-mix(in srgb,var(--t) 65%,#000)}
.badge.dot-b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--t)}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 6px;border:1px solid var(--border-strong);border-radius:var(--r-pill);font-size:12.5px;color:var(--text-muted);background:var(--surface)}
.pill .badge{height:20px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--text-muted)}
.field .hint{font-size:12px;color:var(--text-faint)}
.field.err .hint{color:var(--c-gumamela)}
.field.err .input{border-color:var(--c-gumamela)}
.input,.select,.textarea{width:100%;height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--bg-alt);color:var(--text);font:14px var(--sans);transition:border-color .15s,box-shadow .15s}
.textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.input::placeholder,.textarea::placeholder{color:var(--text-faint)}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input-group{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--bg-alt);padding-left:10px;color:var(--text-faint)}
.input-group .input{border:0;background:transparent;box-shadow:none!important}
.input-group:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.switch{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:var(--r-pill);background:var(--border-strong);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s var(--ease)}
.switch:checked{background:var(--t,var(--accent))}
.switch:checked::after{transform:translateX(14px)}
.chk{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--bg-alt);cursor:pointer;display:inline-grid;place-content:center;flex:none}
.chk:checked{background:var(--t,var(--accent));border-color:var(--t,var(--accent))}
.chk:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.opt{display:flex;gap:10px;align-items:center;font-size:13.5px;cursor:pointer}
.range{width:100%;accent-color:var(--accent)}
.tabs{display:flex;gap:var(--s4);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 0;color:var(--text-muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-alt);gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:var(--r-sm);font-size:12.5px;color:var(--text-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:0 0 0 1px var(--border-strong)}
.alert{--t:var(--c-langit);display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border-radius:var(--r-lg);border:1px solid color-mix(in srgb,var(--t) 35%,var(--border));background:color-mix(in srgb,var(--t) 7%,var(--surface));font-size:13.5px}
.alert .ic{color:var(--t);margin-top:3px}
.alert b{font-weight:600;display:block}
.alert p{color:var(--text-muted)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--sans);color:var(--on-accent);background:var(--t);border:2px solid var(--bg)}
.avatars{display:flex}.avatars .avatar+.avatar{margin-left:-8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 12px var(--sans);color:var(--text-muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-alt);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .mono{font-size:12px;color:var(--text-muted)}
.progress{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--t,var(--accent));border-radius:inherit}
.tip{position:relative}
.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:var(--r);white-space:nowrap;z-index:5}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text-muted)}
.crumbs b{color:var(--text);font-weight:500}
.pages{display:flex;gap:4px}
.pages button{min-width:30px;height:30px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--text-muted)}
.pages button[aria-current="true"]{border-color:var(--accent);color:var(--accent-text);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:var(--r-sm)}
@keyframes sk{to{background-position:-200% 0}}

/* code block */
.code{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-alt);overflow:hidden}
.code-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:0 8px 0 14px}
.code-head .tabs{border:0;gap:var(--s4)}
.code pre{padding:14px 16px;overflow-x:auto;font-size:12.5px;line-height:1.7;color:var(--text);margin:0;tab-size:2}
.tk-k{color:var(--c-ube)} .tk-s{color:var(--c-dahon)} .tk-f{color:var(--c-langit)} .tk-n{color:var(--c-mangga)} .tk-c{color:var(--text-faint)} .tk-p{color:var(--c-dagat)}
[data-theme="light"] .tk-k{color:#6D45E8}[data-theme="light"] .tk-s{color:#13834F}[data-theme="light"] .tk-f{color:#1666C5}[data-theme="light"] .tk-n{color:#9A6400}[data-theme="light"] .tk-p{color:#0B7F8D}

/* toast + palette */
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:10px 14px;font-size:13px;box-shadow:var(--shadow);animation:tin .2s var(--ease)}
.toast .ic{color:var(--c-dahon)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cmd{width:min(560px,100%);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
.cmd .input-group{border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;padding-left:16px;box-shadow:none}
.cmd .input-group .input{height:48px;font-size:15px}
.cmd ul{list-style:none;max-height:340px;overflow-y:auto;padding:6px}
.cmd li button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);border:0;background:none;cursor:pointer;text-align:left;font-size:13.5px;color:var(--text-muted)}
.cmd li button .pip{width:8px;height:8px;border-radius:2px;background:var(--t)}
.cmd li button small{margin-left:auto;color:var(--text-faint);font-size:11.5px}
.cmd li button[aria-selected="true"]{background:var(--surface-2);color:var(--text)}
.cmd-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-faint)}

/* 06 PAGE-SPECIFIC */
.hero{position:relative;border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;padding:var(--s8) var(--s6);background:var(--bg-alt);isolation:isolate}
.hero .bgart{position:absolute;inset:0;z-index:-1;opacity:.9;color:var(--text)}
.hero .bgart svg{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(34px,5.4vw,60px);line-height:1.04;letter-spacing:-.035em;font-weight:600;max-width:720px}
.hero h1 span{color:var(--accent-text)}
.hero p{font-size:16.5px;color:var(--text-muted);max-width:560px;margin:var(--s4) 0 var(--s5)}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s4)}
.bento > *{grid-column:span 2}
.bento .w3{grid-column:span 3}.bento .w4{grid-column:span 4}.bento .w6{grid-column:span 6}
.sw{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;display:grid}
.sw:hover{border-color:var(--border-strong)}
.sw .chipc{height:84px;background:var(--t);position:relative}
.sw .chipc .rx-bb{position:absolute;right:12px;bottom:6px;font-size:26px;color:rgba(0,0,0,.55)}
.sw .meta{padding:12px 14px;display:grid;gap:2px}
.sw .meta b{font-weight:600}
.sw .meta code{font-size:12px;color:var(--text-muted)}
.sw .meta small{font-size:12px;color:var(--text-faint)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.scale div{height:40px;display:flex;align-items:flex-end;padding:4px;font:500 9.5px var(--mono)}
.surf{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.surf div{border:1px solid var(--border);border-radius:var(--r);padding:var(--s3);height:96px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px}
.surf code{font-size:11px;color:var(--text-muted)}
.type-row{display:grid;grid-template-columns:140px 1fr;gap:var(--s4);align-items:baseline;padding:var(--s4) 0;border-bottom:1px solid var(--border)}
.type-row .k{font:500 12px var(--mono);color:var(--text-faint)}
.type-row .k b{display:block;color:var(--text-muted);font-weight:500}
.space-row{display:grid;grid-template-columns:60px 70px 1fr;align-items:center;gap:var(--s3);padding:6px 0;font-size:12.5px}
.space-row i{display:block;height:12px;background:var(--accent);border-radius:2px;opacity:.85}
.rad-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3)}
.rad-grid div{height:88px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:flex-end;padding:10px;font:500 11.5px var(--mono);color:var(--text-muted)}
.icon-hero{display:grid;grid-template-columns:auto 1fr;gap:var(--s6);align-items:center}
.icon-hero .big svg{width:180px;height:180px}
.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.variant{border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4);display:grid;gap:10px;justify-items:center;background:var(--surface)}
.variant svg{width:72px;height:72px}
.variant .row{gap:6px;justify-content:center}
.ladder{display:flex;align-items:flex-end;gap:var(--s5);flex-wrap:wrap}
.ladder div{display:grid;gap:6px;justify-items:center;font:500 11px var(--mono);color:var(--text-faint)}
.browser-tab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--surface);font-size:12.5px}
.browser-tab svg{width:16px;height:16px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:2px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--border)}
.icons button{background:var(--surface);border:0;padding:18px 6px 12px;display:grid;justify-items:center;gap:10px;cursor:pointer;color:var(--text-muted);font-size:11.5px}
.icons button:hover{background:var(--surface-2);color:var(--text)}
.icons .ic{width:22px;height:22px}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s4)}
.art-card{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);display:grid}
.art-card .pv{background:var(--bg-alt);border-bottom:1px solid var(--border);color:var(--text)}
.art-card .pv svg{width:100%;height:auto}
.art-card .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
.art-card .ft b{font-weight:500;font-size:13px}
.art-card .ft small{display:block;font:500 10.5px var(--mono);color:var(--text-faint);letter-spacing:.04em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s4)}
.chips button{height:28px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;font-size:12.5px}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.bb-conv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--s4)}
.bb-out{min-height:140px;display:flex;align-items:center;overflow-x:auto;color:var(--accent-text)}
.bb-out svg{height:var(--bb-h,96px);width:auto;max-width:none;flex:none}
.bb-uni{font-size:30px;word-break:break-all;color:var(--text)}
.bb-chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:2px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.bb-chart button{background:var(--surface);border:0;padding:12px 4px 8px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.bb-chart button:hover{background:var(--surface-2)}
.bb-chart .g{font-family:var(--bb);font-weight:700;font-size:32px;line-height:1.3;color:var(--t,var(--text))}
.bb-chart small{font:500 10.5px var(--mono);color:var(--text-faint)}
.frame{border:1px solid var(--border-strong);border-radius:var(--r-xl);overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.frame-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-alt)}
.frame-bar i{width:10px;height:10px;border-radius:50%;background:var(--border-strong)}
.frame-bar span{margin:0 auto;font:500 11.5px var(--mono);color:var(--text-faint);border:1px solid var(--border);padding:2px 14px;border-radius:var(--r-pill);background:var(--surface)}
/* landing template */
.lp-nav{display:flex;align-items:center;gap:var(--s5);padding:14px var(--s5);border-bottom:1px solid var(--border)}
.lp-nav nav{display:flex;gap:var(--s4);font-size:13px;color:var(--text-muted)}
.lp-hero{text-align:center;padding:var(--s9) var(--s5) var(--s8);position:relative;isolation:isolate;overflow:hidden}
.lp-hero .bgart{position:absolute;inset:0;z-index:-1;opacity:.55}
.lp-hero .bgart svg{width:100%;height:100%}
.lp-hero h2{display:block;font-size:clamp(32px,5.5vw,64px);line-height:1.02;letter-spacing:-.04em;margin:var(--s4) auto 0;font-weight:600}
.lp-hero h2::before{display:none}
.lp-hero h2 span{color:var(--accent-text);display:block}
.lp-hero p{max-width:540px;margin:var(--s4) auto var(--s5);color:var(--text-muted);font-size:16px}
.logos{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s6);padding:var(--s5);border-top:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--text-faint);font:600 15px var(--sans);letter-spacing:.12em}
.lp-sec{padding:var(--s8) var(--s5)}
.lp-foot{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:var(--s5);padding:var(--s7) var(--s5);border-top:1px solid var(--border);font-size:13px}
.lp-foot ul{list-style:none;display:grid;gap:6px;color:var(--text-muted)}
.lp-foot h5{font-size:13px;font-weight:500;margin-bottom:var(--s2)}
.tier{border:1px solid var(--border);border-radius:var(--r-xl);padding:var(--s5);background:var(--surface);display:grid;gap:var(--s4);align-content:start}
.tier.feat{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tier .price{font-size:34px;font-weight:600;letter-spacing:-.03em}
.tier .price small{font-size:13px;color:var(--text-muted);font-weight:400;letter-spacing:0}
.tier ul{list-style:none;display:grid;gap:8px;font-size:13px;color:var(--text-muted)}
.tier li{display:flex;gap:8px;align-items:flex-start}
.tier li .ic{color:var(--t,var(--accent));margin-top:3px;width:14px;height:14px}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:520px}
.auth-form{padding:var(--s7) var(--s6);display:grid;gap:var(--s4);align-content:center;max-width:420px;width:100%;margin:0 auto}
.auth-art{border-left:1px solid var(--border);background:var(--bg-alt);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s6);isolation:isolate}
.auth-art .bgart{position:absolute;inset:0;z-index:-1;color:var(--text)}
.auth-art .bgart svg{width:100%;height:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.studio{display:grid;grid-template-columns:52px 210px 1fr;min-height:560px;font-size:13px}
.rail{border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--bg-alt)}
.rail button{width:36px;height:36px;border-radius:var(--r);border:0;background:none;display:grid;place-items:center;color:var(--text-faint);cursor:pointer}
.rail button:hover{color:var(--text);background:var(--surface-2)}
.rail button[aria-current="page"]{color:var(--accent-text);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.studio-side{border-right:1px solid var(--border);padding:var(--s4) var(--s3);display:grid;gap:4px;align-content:start}
.studio-side a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);color:var(--text-muted);cursor:pointer}
.studio-side a.on{background:var(--surface-2);color:var(--text)}
.studio-main{min-width:0;display:flex;flex-direction:column}
.studio-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px var(--s4);border-bottom:1px solid var(--border);flex-wrap:wrap}
.stat{display:grid;gap:6px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat .d{font-size:12px}
.stat svg{height:40px;width:100%}

/* 07 RESPONSIVE */
@media (max-width:1240px){.shell{grid-template-columns:var(--side) minmax(0,1fr)}.toc{display:none}}
@media (max-width:960px){
  .hdr-nav,.search span.txt{display:none}.search{min-width:0}
  .menu-btn{display:grid}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:var(--hdr);bottom:0;width:min(300px,86vw);z-index:60;background:var(--bg);transform:translateX(-100%);transition:transform .2s var(--ease);height:auto}
  body.nav-open .side{transform:none;box-shadow:var(--shadow)}
  .page{padding:var(--s6) var(--s4) var(--s8)}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento > *,.bento .w3,.bento .w4{grid-column:span 3}
  .auth{grid-template-columns:1fr}.auth-art{border-left:0;border-top:1px solid var(--border);min-height:260px}
  .studio{grid-template-columns:52px 1fr}.studio-side{display:none}
  .lp-foot{grid-template-columns:1fr 1fr}
  .surf{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .hdr{padding:0 var(--s3);gap:var(--s2)}.logo .ver,.dots{display:none}
  .g2,.g3,.g4,.bb-conv{grid-template-columns:1fr}
  .bento > *,.bento .w3,.bento .w4,.bento .w6{grid-column:span 6}
  .hero{padding:var(--s6) var(--s4)}
  .icon-hero{grid-template-columns:1fr}
  .type-row{grid-template-columns:1fr;gap:4px}
  .rad-grid{grid-template-columns:repeat(2,1fr)}
  .pager{grid-template-columns:1fr}.pager a.next{grid-column:1}
  .scale{grid-template-columns:repeat(5,1fr)}
  .lp-nav nav{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* 08 FIXES */
.card .art .mk svg{width:96px;height:96px}
.hero .bgart{-webkit-mask-image:linear-gradient(90deg,transparent 15%,#000 65%);mask-image:linear-gradient(90deg,transparent 15%,#000 65%)}
.card .art svg{max-height:240px}
.bb-chart,.icons{gap:0;background:var(--surface)}
.bb-chart button,.icons button{box-shadow:inset -1px -1px 0 var(--border)}

</style>
</head>
